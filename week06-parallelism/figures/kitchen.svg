<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Threads and processes as cooks and kitchens</title><desc id="d">Left: threading is one kitchen with three cooks sharing one pantry and one knife, the GIL, so only one cook cuts at a time. Right: multiprocessing is two separate kitchens, each with its own cook, pantry and knife; dishes pass between them through a hatch, the Queue.</desc><rect width="760" height="380" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker></defs><text x="185" y="28" font-size="14" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">threading: one kitchen, several cooks</text><rect x="20" y="42" width="330" height="270" rx="12" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4"/><rect x="40" y="60" width="290" height="46" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="185" y="80" font-size="12.5" fill="#1e7f4f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">one pantry = shared memory</text><text x="185" y="97" font-size="11" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">every cook can reach every ingredient</text><rect x="76" y="160" width="18" height="10" rx="3" fill="#ffffff" stroke="#c8862b" stroke-width="1.2"/><circle cx="85" cy="178" r="9" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><path d="M70 212 Q85 184 100 212 Z" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><text x="85" y="228" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">thread 1</text><rect x="176" y="160" width="18" height="10" rx="3" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/><circle cx="185" cy="178" r="9" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.3"/><path d="M170 212 Q185 184 200 212 Z" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.3"/><text x="185" y="228" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">thread 2</text><rect x="276" y="160" width="18" height="10" rx="3" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/><circle cx="285" cy="178" r="9" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.3"/><path d="M270 212 Q285 184 300 212 Z" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.3"/><text x="285" y="228" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">thread 3</text><rect x="100" y="150" width="30" height="7" rx="3" fill="#cfd6df" stroke="#7a8291" stroke-width="1"/><rect x="130" y="149" width="16" height="9" rx="2" fill="#c8862b"/><text x="123" y="144" font-size="10.5" fill="#c8862b" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">GIL</text><text x="185" y="262" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">one knife (the GIL): only the cook holding it</text><text x="185" y="279" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">can cut, so CPU work takes turns;</text><text x="185" y="296" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">waiting (an oven, a delivery) can overlap</text><text x="570" y="28" font-size="14" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">multiprocessing: separate kitchens</text><rect x="395" y="42" width="155" height="270" rx="12" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4"/><rect x="410" y="60" width="125" height="46" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="472" y="80" font-size="12.5" fill="#1e7f4f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">own pantry</text><text x="472" y="97" font-size="11" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">(own memory)</text><rect x="463" y="160" width="18" height="10" rx="3" fill="#ffffff" stroke="#c8862b" stroke-width="1.2"/><circle cx="472" cy="178" r="9" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><path d="M457 212 Q472 184 487 212 Z" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><text x="472" y="228" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">process 1</text><rect x="449" y="150" width="30" height="7" rx="3" fill="#cfd6df" stroke="#7a8291" stroke-width="1"/><rect x="479" y="149" width="16" height="9" rx="2" fill="#c8862b"/><text x="472" y="144" font-size="10.5" fill="#c8862b" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">own GIL</text><text x="472" y="262" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">cuts at the same</text><text x="472" y="279" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">time as the other</text><rect x="590" y="42" width="155" height="270" rx="12" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4"/><rect x="605" y="60" width="125" height="46" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="667" y="80" font-size="12.5" fill="#1e7f4f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">own pantry</text><text x="667" y="97" font-size="11" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">(own memory)</text><rect x="658" y="160" width="18" height="10" rx="3" fill="#ffffff" stroke="#c8862b" stroke-width="1.2"/><circle cx="667" cy="178" r="9" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><path d="M652 212 Q667 184 682 212 Z" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.3"/><text x="667" y="228" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">process 2</text><rect x="644" y="150" width="30" height="7" rx="3" fill="#cfd6df" stroke="#7a8291" stroke-width="1"/><rect x="674" y="149" width="16" height="9" rx="2" fill="#c8862b"/><text x="667" y="144" font-size="10.5" fill="#c8862b" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">own GIL</text><text x="667" y="262" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">cuts at the same</text><text x="667" y="279" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">time as the other</text><rect x="551" y="210" width="38" height="24" rx="3" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><line x1="553" y1="222" x2="588" y2="222" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#a)"/><text x="570" y="330" font-size="12" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">the hatch between kitchens: Queue / Pipe</text><text x="570" y="347" font-size="11.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">(data is copied through it: pickled)</text><text x="380.0" y="374" font-size="12.5" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">One chef juggling dishes = concurrency.  Several chefs cooking at once = parallelism.</text></svg>