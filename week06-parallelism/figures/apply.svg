<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">apply versus apply_async</title><desc id="d">With apply, task 2 starts only after task 1 has finished, so the total is about 5.5 seconds. With apply_async, both tasks start at once on two workers, so the total is about 3 seconds.</desc><rect width="760" height="300" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker></defs><text x="20" y="34" font-size="13.5" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">pool.apply(): blocking, one task after the other</text><text x="198" y="63.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">count_total(5)</text><rect x="210" y="48" width="175.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="198" y="93.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">count_total(6)</text><line x1="210" y1="89.0" x2="385.0" y2="89.0" stroke="#9fb0c3" stroke-width="1"/><rect x="385.0" y="78" width="210.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="603.0" y="96" font-size="12" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">≈ 5.5 s</text><text x="20" y="150" font-size="13.5" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">pool.apply_async(): non-blocking, both tasks at once</text><text x="198" y="179.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">count_total(5)</text><rect x="210" y="164" width="175.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="198" y="209.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">count_total(6)</text><rect x="210" y="194" width="210" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="428" y="212" font-size="12" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">≈ 3 s</text><line x1="210" y1="240" x2="630" y2="240" stroke="#7a8291" stroke-width="1"/><line x1="210" y1="236" x2="210" y2="244" stroke="#7a8291" stroke-width="1"/><text x="210" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">0 s</text><line x1="280" y1="236" x2="280" y2="244" stroke="#7a8291" stroke-width="1"/><text x="280" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">1 s</text><line x1="350" y1="236" x2="350" y2="244" stroke="#7a8291" stroke-width="1"/><text x="350" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">2 s</text><line x1="420" y1="236" x2="420" y2="244" stroke="#7a8291" stroke-width="1"/><text x="420" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">3 s</text><line x1="490" y1="236" x2="490" y2="244" stroke="#7a8291" stroke-width="1"/><text x="490" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">4 s</text><line x1="560" y1="236" x2="560" y2="244" stroke="#7a8291" stroke-width="1"/><text x="560" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">5 s</text><line x1="630" y1="236" x2="630" y2="244" stroke="#7a8291" stroke-width="1"/><text x="630" y="258" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">6 s</text><text x="380.0" y="290" font-size="12" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">apply() waits for each result before the next call; apply_async() returns an AsyncResult at once, and .get() waits later.</text></svg>