<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">The GIL on a timeline</title><desc id="d">Two CPU-bound threads take turns holding the GIL, so they finish no sooner than one after the other. Two I/O-bound threads overlap their waiting, because waiting releases the GIL. Two processes each have their own GIL and run at the same time on two cores.</desc><rect width="760" height="420" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker></defs><text x="20" y="36" font-size="13.5" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">1 · two threads, CPU-bound work: they take turns holding the GIL</text><text x="138" y="63.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">thread 1</text><rect x="150" y="48" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="210" y1="59.0" x2="270" y2="59.0" stroke="#9fb0c3" stroke-width="1"/><rect x="270" y="48" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="330" y1="59.0" x2="390" y2="59.0" stroke="#9fb0c3" stroke-width="1"/><rect x="390" y="48" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="450" y1="59.0" x2="510" y2="59.0" stroke="#9fb0c3" stroke-width="1"/><rect x="510" y="48" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="138" y="91.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">thread 2</text><line x1="150" y1="87.0" x2="210" y2="87.0" stroke="#9fb0c3" stroke-width="1"/><rect x="210" y="76" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="270" y1="87.0" x2="330" y2="87.0" stroke="#9fb0c3" stroke-width="1"/><rect x="330" y="76" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="390" y1="87.0" x2="450" y2="87.0" stroke="#9fb0c3" stroke-width="1"/><rect x="450" y="76" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><line x1="510" y1="87.0" x2="570" y2="87.0" stroke="#9fb0c3" stroke-width="1"/><rect x="570" y="76" width="60" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="150" y="122" font-size="11.5" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">≈ the same total time as running them one after the other</text><text x="20" y="146" font-size="13.5" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">2 · two threads, I/O-bound work: waiting releases the GIL, so the waits overlap</text><text x="138" y="173.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">thread 1</text><rect x="150" y="158" width="30.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><rect x="180.0" y="158" width="180.0" height="22" rx="3" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="360.0" y="158" width="30.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="138" y="201.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">thread 2</text><line x1="150" y1="197.0" x2="180.0" y2="197.0" stroke="#9fb0c3" stroke-width="1"/><rect x="180.0" y="186" width="30.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><rect x="210" y="186" width="180" height="22" rx="3" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="390" y="186" width="30.0" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="432.0" y="190" font-size="11.5" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">≈ half the time of one after the other</text><text x="20" y="256" font-size="13.5" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">3 · two processes: each has its own interpreter and GIL, on its own core</text><text x="138" y="283.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">process 1</text><rect x="150" y="268" width="240" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="138" y="311.0" font-size="12" fill="#1b1f24" text-anchor="end" font-family="Consolas, Menlo, monospace" font-weight="normal">process 2</text><rect x="150" y="296" width="240" height="22" rx="3" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="402" y="300" font-size="11.5" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">true parallelism: ≈ half the time on 2 cores</text><line x1="150" y1="340" x2="690" y2="340" stroke="#7a8291" stroke-width="1"/><text x="690" y="356" font-size="11.5" fill="#7a8291" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">time →</text><rect x="150" y="378" width="16" height="14" rx="2" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="172" y="390" font-size="11.5" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">running Python code (holds the GIL)</text><rect x="420" y="378" width="16" height="14" rx="2" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4" stroke-dasharray="5 3"/><text x="442" y="390" font-size="11.5" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">waiting for disk or network (GIL released)</text></svg>