<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">A process pool</title><desc id="d">Six tasks wait in a queue. A pool of two worker processes takes them one at a time; each finished task's result is collected, and the results come back in the order of the tasks.</desc><rect width="760" height="330" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker></defs><text x="95" y="30" font-size="14" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">tasks</text><rect x="45" y="46" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="65" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(1)</text><rect x="45" y="84" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="103" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(2)</text><rect x="45" y="122" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="141" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(3)</text><rect x="45" y="160" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="179" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(4)</text><rect x="45" y="198" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="217" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(5)</text><rect x="45" y="236" width="100" height="28" rx="4" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.4"/><text x="95" y="255" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">square(6)</text><line x1="152" y1="160" x2="232" y2="160" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#a)"/><text x="192" y="150" font-size="11.5" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">submit</text><rect x="240" y="40" width="260" height="240" rx="14" fill="#f6f8fa" stroke="#9fb0c3" stroke-width="1.4"/><text x="370" y="64" font-size="13.5" fill="#1f3a5f" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="600">Pool(processes=2)</text><rect x="270" y="95" width="200" height="62" rx="8" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="370" y="120" font-size="12.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">worker process 1</text><text x="370" y="140" font-size="11" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">takes the next task when free</text><rect x="270" y="180" width="200" height="62" rx="8" fill="#fbf1e3" stroke="#c8862b" stroke-width="1.4"/><text x="370" y="205" font-size="12.5" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">worker process 2</text><text x="370" y="225" font-size="11" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">takes the next task when free</text><text x="370" y="268" font-size="11" fill="#7a8291" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">workers are created once and reused</text><line x1="508" y1="160" x2="588" y2="160" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#a)"/><text x="548" y="150" font-size="11.5" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">collect</text><text x="665" y="30" font-size="14" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">results</text><rect x="615" y="46" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="65" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">1</text><rect x="615" y="84" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="103" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">4</text><rect x="615" y="122" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="141" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">9</text><rect x="615" y="160" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="179" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">16</text><rect x="615" y="198" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="217" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">25</text><rect x="615" y="236" width="100" height="28" rx="4" fill="#e6f4ec" stroke="#1e7f4f" stroke-width="1.4"/><text x="665" y="255" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">36</text><text x="380.0" y="308" font-size="12.5" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">Lifecycle: create Pool  →  submit tasks  →  close()  →  join().   map() returns the list of results, in task order;</text><text x="380.0" y="326" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">apply_async() returns one AsyncResult per task (call .get()).   With  with Pool(...) as pool:  collect every result inside the block.</text></svg>