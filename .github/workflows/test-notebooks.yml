name: Execute notebooks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python data/make_data.py
      - name: Execute every tutorial and solution notebook
        run: |
          set -e
          for nb in $(git ls-files '*.ipynb' | grep -v '_exercises.ipynb' | grep -v 'project/'); do
            echo "=== $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=300 \
              --output /tmp/out.ipynb "$nb"
          done
